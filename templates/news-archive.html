<section class="news-archive">
  <span class="news-kicker"># დღის ამბები</span>
  <h1>არქივი</h1>
  <p class="news-archive-lede">ყველა გამოქვეყნებული გამოშვება, თარიღების მიხედვით.</p>
  {{#if hasEditions}}
  <ol class="news-archive-list">
    {{{editionsHtml}}}
  </ol>
  {{/if}}
  {{#if isEmpty}}
  <p class="news-archive-empty">ჯერ არცერთი მიმოხილვა არ გამოგვიქვეყნებია. პირველი გამოშვების შემდეგ ყველა დღე აქ მოიყრის თავს.</p>
  {{/if}}
</section>
