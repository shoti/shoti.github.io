<section class="news-archive">
  <header class="news-page-head">
    <p class="news-kicker">დღის ამბები</p>
    <h1>არქივი</h1>
    <p class="news-archive-lede">ყველა გამოქვეყნებული გამოშვება, თარიღების მიხედვით. <a href="/news/rss.xml">RSS-ით გამოწერა</a></p>
  </header>
  {{#if hasEditions}}
  <ol class="news-archive-list">
    {{{editionsHtml}}}
  </ol>
  {{/if}}
  {{#if isEmpty}}
  <p class="news-archive-empty">ჯერ არცერთი მიმოხილვა არ გამოგვიქვეყნებია. პირველი გამოშვების შემდეგ ყველა დღე აქ მოიყრის თავს.</p>
  {{/if}}
</section>
