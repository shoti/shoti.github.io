<article class="post">
  <header class="post-header">
    <h1>{{postTitle}}</h1>
    <div class="post-header-details">
      <div class="post-meta">
        <time datetime="{{date}}">{{dateFormatted}}</time>
        <span class="reading-time">{{readingTime}} {{readingTimeSuffix}}</span>
        {{#if tags}}<span class="post-tags">{{tags}}</span>{{/if}}
      </div>
      <details class="reader-settings">
        <summary aria-label="{{readerSettingsLabel}}"><span aria-hidden="true">Aa</span></summary>
        <div class="reader-settings-panel">
          <div class="reader-settings-heading">{{readerSettingsLabel}}</div>
          <fieldset>
            <legend>{{textSizeLabel}}</legend>
            <div class="reader-size-control">
              <button type="button" data-reader-size-step="-1" aria-label="{{decreaseTextLabel}}">−</button>
              <output id="reader-size-value" aria-live="polite">100%</output>
              <button type="button" data-reader-size-step="1" aria-label="{{increaseTextLabel}}">+</button>
            </div>
          </fieldset>
          <fieldset>
            <legend>{{typefaceLabel}}</legend>
            <div class="reader-options">
              <button type="button" data-reader-font="serif" aria-pressed="true">{{serifLabel}}</button>
              <button type="button" data-reader-font="sans" aria-pressed="false">{{sansLabel}}</button>
            </div>
          </fieldset>
          <fieldset>
            <legend>{{spacingLabel}}</legend>
            <div class="reader-options reader-spacing-options">
              <button type="button" data-reader-spacing="compact" aria-pressed="false">{{compactLabel}}</button>
              <button type="button" data-reader-spacing="comfortable" aria-pressed="true">{{comfortableLabel}}</button>
              <button type="button" data-reader-spacing="relaxed" aria-pressed="false">{{relaxedLabel}}</button>
            </div>
          </fieldset>
          <button class="reader-reset" type="button" id="reader-reset">{{resetLabel}}</button>
        </div>
      </details>
    </div>
  </header>
  <details class="post-toc" id="post-toc" hidden>
    <summary>{{contentsLabel}} <span id="post-toc-count"></span></summary>
    <nav aria-label="{{contentsNavLabel}}">
      <ol id="post-toc-list"></ol>
    </nav>
  </details>
  <div class="post-body">
    {{{body}}}
  </div>
  <nav class="post-nav" aria-label="{{postNavLabel}}">
    {{#if prevPost}}<a href="/posts/{{prevSlug}}/" class="post-nav-prev">← {{prevTitle}}</a>{{/if}}
    {{#if nextPost}}<a href="/posts/{{nextSlug}}/" class="post-nav-next">{{nextTitle}} →</a>{{/if}}
  </nav>
</article>
