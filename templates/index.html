<h1 class="intro">Senior Software Engineer writing about code and things.</h1>
<section class="post-list" aria-label="Latest posts">
  {{#each posts}}
  <article class="post-item">
    <time datetime="{{date}}">{{dateFormatted}}</time>
    <div>
      <a href="/posts/{{slug}}/">{{title}}</a>
      <span class="post-desc">{{description}}</span>
    </div>
  </article>
  {{/each}}
</section>
